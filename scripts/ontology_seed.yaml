# 인사이트맵 기준 지식 레이어 시드 데이터.
#
# concepts는 UtterAI_AI/app/rag/ontology.yaml(RAG 쿼리 확장용 개념 사전)의 concept_key/
# related_terms/language_area를 그대로 가져오되, ontology_concepts 테이블에 필요한
# concept_type(metric/disorder/intervention/assessment_tool/linguistic_construct/
# clinical_documentation/process)을 추가로 분류했다.
#
# edges는 두 온톨로지 문서 어디에도 없던 신규 정보다 — "03. 온톨로지맵 설계서" 3.1절의
# MLU 예시 체인을 시작으로, 38개 concept 전부가 최소 1개 이상의 관계를 갖도록 SLP
# 도메인 지식 기준으로 확장했다. confidence는 관계의 확실성을 나타내는 주관적 가중치이며,
# 실제 임상 문헌 인용 근거(evidence_source_ids)가 아직 없는 상태다 — 문헌 연결은 후속 작업.

concepts:
  MLU:
    label: "MLU"
    synonyms: ["평균 발화 길이", "형태소 수", "문장 길이", "발화 복잡도", "표현언어", "MLU-w", "MLU-m", "MLU-e", "LLU", "K-ALAS", "어절", "발화 수"]

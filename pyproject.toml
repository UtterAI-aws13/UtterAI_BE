[project]
name = "utterai-be"
version = "0.1.0"
description = "UtterAI functional backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.1,<2.0.0",
    "boto3>=1.39.0,<2.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "sqlalchemy>=2.0.41,<3.0.0",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "opentelemetry-api>=1.27.0,<2.0.0",
    "opentelemetry-sdk>=1.27.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.27.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<0.49.0",
    "opentelemetry-instrumentation-httpx>=0.48b0,<0.49.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<0.49.0",
    "opentelemetry-instrumentation-botocore>=0.48b0,<0.49.0",
    "redis>=5.0.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "alembic*"]

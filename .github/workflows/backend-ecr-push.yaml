name: Backend ECR Push

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "app/**"
      - "alembic/**"
      - "pyproject.toml"
      - "alembic.ini"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-ecr-push.yaml"

  workflow_dispatch:
    inputs:
      target_env:
        description: "수동 실행 시 이미지를 만들 환경입니다. dev는 dev 브랜치, prod는 main 브랜치를 사용합니다."
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-latest

    outputs:
      target_env: ${{ steps.meta.outputs.target_env }}
      source_ref: ${{ steps.meta.outputs.source_ref }}

    steps:
      - name: Create image metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET_ENV: ${{ inputs.target_env }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_ENV="$INPUT_TARGET_ENV"

            if [ "$TARGET_ENV" = "prod" ]; then
              SOURCE_REF="main"
            elif [ "$TARGET_ENV" = "dev" ]; then
              SOURCE_REF="dev"
            else
              echo "target_env는 dev 또는 prod만 허용합니다."
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            TARGET_ENV="prod"
            SOURCE_REF="main"
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            TARGET_ENV="dev"
            SOURCE_REF="dev"
          else
            echo "ECR push는 dev 또는 main 브랜치에서만 실행합니다."
            exit 1
          fi

          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

          echo "TARGET_ENV=$TARGET_ENV"
          echo "SOURCE_REF=$SOURCE_REF"

  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: prepare

    environment:
      name: ${{ needs.prepare.outputs.target_env }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Create image tag
        id: image-meta
        env:
          TARGET_ENV: ${{ needs.prepare.outputs.target_env }}
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          IMAGE_TAG="${TARGET_ENV}-${SHORT_SHA}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$IMAGE_TAG"

      - name: Validate required variables
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "AWS_REGION GitHub Variable이 필요합니다."
            exit 1
          fi

          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "AWS_ROLE_ARN GitHub Variable이 필요합니다."
            exit 1
          fi

          if [ -z "$ECR_REPOSITORY" ]; then
            echo "ECR_BACKEND_REPOSITORY GitHub Variable이 필요합니다."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-meta.outputs.image_tag }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Build image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" .

          echo "Push image: $IMAGE_URI"
          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI"

      - name: Create Infra GitHub App token
        id: infra-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.UTTERAI_GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.UTTERAI_GITOPS_APP_PRIVATE_KEY }}
          owner: UtterAI-aws13
          repositories: UtterAI_Infra
          permission-contents: write

      - name: Dispatch GitOps image update
        env:
          GH_TOKEN: ${{ steps.infra-app-token.outputs.token }}
          TARGET_ENV: ${{ needs.prepare.outputs.target_env }}
          IMAGE_TAG: ${{ steps.image-meta.outputs.image_tag }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          gh api repos/UtterAI-aws13/UtterAI_Infra/dispatches \
            --method POST \
            -f event_type=backend-image-pushed \
            -f "client_payload[target_env]=$TARGET_ENV" \
            -f "client_payload[image_tag]=$IMAGE_TAG" \
            -f "client_payload[ecr_registry]=$ECR_REGISTRY" \
            -f "client_payload[ecr_repository]=$ECR_REPOSITORY"

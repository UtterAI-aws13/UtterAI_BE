name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yaml"

  push:
    branches:
      - dev
      - main
      - "feature/**"
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yaml"

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend test and image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Import FastAPI app
        run: uv run python -c "from app.main import app; print(app.title)"

      - name: Run pytest
        run: uv run pytest

      - name: Docker build check
        run: docker build -t utterai-backend:ci .

name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "pyproject.toml"
      - "alembic.ini"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yaml"

  push:
    branches:
      - dev
      - main
      - "feature/**"
    paths:
      - "app/**"
      - "alembic/**"
      - "tests/**"
      - "pyproject.toml"
      - "alembic.ini"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-ci.yaml"

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend test and image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import FastAPI app
        run: |
          python -c "from app.main import app; print(app.title)"

      - name: Run pytest
        run: pytest

      - name: Docker build check
        run: docker build -t utterai-backend:ci .
